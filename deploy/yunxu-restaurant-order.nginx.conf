limit_req_zone $binary_remote_addr zone=yunxu_order_login:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=yunxu_order_clients:1m;

server {
    listen 8083 default_server;
    server_name _;

    allow 192.168.8.0/24;
    allow 127.0.0.1;
    deny all;

    # Table access keys are part of request URLs.
    access_log off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    proxy_read_timeout 15s;
    limit_conn yunxu_order_clients 24;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:8183;
    }

    location = /api/admin/login {
        limit_req zone=yunxu_order_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8183;
    }
}
